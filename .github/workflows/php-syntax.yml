name: PHP syntax
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Check PHP syntax
        run: |
          find includes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
